# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.hadha.co;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── API server ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.hadha.co;

    ssl_certificate     /etc/letsencrypt/live/hadha.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hadha.co/privkey.pem;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend "hadha-backend:8000";

    # ── Security Headers ───────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;

    # Block dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Auth rate limiting (10r/m) ─────────────────────────
    # Every backend route is mounted under API_V1_PREFIX (see
    # Backend/app/main.py:_mount_routers), so the real path is
    # /api/v1/auth/..., not /auth/... — matching the bare prefix here meant
    # this block never matched anything and auth traffic silently fell
    # through to the general 60r/m `/` block below.
    location /api/v1/auth/ {
        limit_req zone=auth burst=3 nodelay;
        limit_conn connlimit 20;

        proxy_pass http://$backend;
    }

    # ── Media upload / replace (large binary bodies, 20r/m) ─
    # POST /api/v1/admin/media/{preset_id}/upload and
    # PUT  /api/v1/admin/media/{image_id}/replace (see
    # Backend/app/modules/media/router.py) — matched by path, not a bare
    # `/upload/` prefix, which (same bug as /auth/ above) never matched
    # either real route. Every upload/replace was silently falling through
    # to the general `/` block's 10m client_max_body_size below, which
    # kills the connection mid-transfer for any photo over ~10MB — the
    # browser sees that as a network failure, not a clean 413.
    location ~ ^/api/v1/admin/media/[^/]+/(upload|replace)$ {
        limit_req zone=upload burst=5 nodelay;
        limit_conn connlimit 20;
        client_max_body_size 50m;

        proxy_pass http://$backend;
        proxy_request_buffering off;
    }

    # ── General API rate limiting (60r/m) ──────────────────
    location / {
        limit_req zone=api burst=20 nodelay;
        limit_conn connlimit 20;

        # Large response buffers for API payloads
        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;

        proxy_pass http://$backend;
    }
}
