name: hadha-database

# =============================================================================
# Application database (PostgreSQL) — its OWN compose project on purpose.
#
# deploy.sh runs `docker compose down` + `up` on the infrastructure project on
# every release. Keeping Postgres out of that project means a deploy never
# restarts the database. Brought up by scripts/db-setup.sh (idempotent) and
# kept alive across reboots by the restart policy.
#
# Reachable only on the internal `hadha` Docker network as hadha-postgres:5432;
# no port is published. Credentials live in /opt/hadha/.env.postgres (mode 600,
# generated by db-setup.sh, never committed).
# =============================================================================

services:
  postgres:
    # Same major.minor as the Supabase instance it replaces (17.6).
    image: postgres:17.6-alpine
    container_name: hadha-postgres
    restart: unless-stopped
    env_file: /opt/hadha/.env.postgres
    environment:
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      # SSD-backed VPS volume.
      - -c
      - random_page_cost=1.1
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      # Slow-query visibility (Loki picks the container log up via promtail).
      - -c
      - log_min_duration_statement=500
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - timezone=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    stop_grace_period: 60s
    networks:
      - hadha
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    external: true
    name: hadha_postgres_data

networks:
  hadha:
    external: true
    name: hadha
